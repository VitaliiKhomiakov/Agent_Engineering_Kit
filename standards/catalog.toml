# Semantics: standards/catalog.md (paths resolve from the bundle root).
# Dependencies/resources describe available files, not a recursive reading queue.
schema_version = 1
assets = ["templates/PLANS.md", "templates/task.md", "standards/catalog.md", "standards/catalog.toml", "templates/framework/adoption-record.md"]
templates = {entry = "templates/policy-entry.md", claude-bridge = "templates/claude/policy-bridge.md", cursor-rule = "templates/cursor/rule-route.mdc"}

[[profiles]]
id = "core"
source = "standards/core.md"
required = true
activities = ["design", "implementation", "test", "review"]
when = "Changing behavior, architecture, or code structure; read the relevant sections only."
dependencies = ["work-modes", "verification", "delivery-workflow"]

[[profiles]]
id = "work-modes"
source = "standards/work-modes.md"
required = true
activities = ["design", "implementation", "test", "review", "documentation", "orchestration", "setup"]
when = "Selecting work mode, stage boundaries, repository scope, or Git actions."

[[profiles]]
id = "verification"
source = "standards/verification.md"
required = true
activities = ["implementation", "test", "review", "documentation"]
when = "Before editing, selecting checks, reviewing, or claiming completion."

[[profiles]]
id = "delivery-workflow"
source = "standards/delivery-workflow.md"
required = true
activities = ["design", "orchestration"]
when = "Choosing phases, planning artifacts, or a delivery workflow."
dependencies = ["superpowers"]

[[profiles]]
id = "superpowers"
source = "standards/superpowers.md"
resources = ["standards/superpowers/compatibility.md"]
required = true
activities = ["orchestration"]
when = "Applying an available Superpowers skill; this policy does not install the plugin."
dependencies = ["orchestration"]

[[profiles]]
id = "orchestration"
source = "standards/orchestration.md"
required = true
activities = ["orchestration"]
when = "Delegating a bounded task under the saved role choices and task authorization."
dependencies = ["model-configuration"]

[[profiles]]
id = "model-configuration"
source = "standards/model-configuration.md"
resources = [
  "templates/framework/model-routing.toml",
  "templates/codex/README.md",
  "templates/codex/config.toml",
  "templates/codex/agents/af-implementer.toml",
  "templates/codex/agents/af-reviewer.toml",
  "templates/skills/af-model-setup/SKILL.md",
  "templates/skills/af-model-reassign/SKILL.md",
]
required = true
activities = ["setup"]
when = "Initial model setup, explicit reassignment, or relevant configuration repair."

[[profiles]]
id = "python-fastapi"
source = "standards/python-fastapi.md"
resources = [
  "standards/python/structure.md",
  "standards/python/typing-contracts.md",
  "standards/python/execution-resources.md",
  "standards/python/verification.md",
  "standards/python/examples/domain.md",
  "standards/python/examples/concurrency.md",
  "standards/pydantic/validation.md",
  "standards/pydantic/serialization.md",
  "standards/pydantic/lifecycle.md",
  "standards/pydantic/verification.md",
  "standards/pydantic/examples/boundary.md",
  "standards/pydantic/examples/patches.md",
  "standards/fastapi/transport.md",
  "standards/fastapi/dependencies-lifetime.md",
  "standards/fastapi/runtime-operations.md",
  "standards/fastapi/verification.md",
  "standards/fastapi/examples/http-boundary.md",
  "standards/fastapi/examples/lifetime.md",
]
technologies = ["python", "fastapi", "pydantic"]
activities = ["design", "implementation", "test", "review"]
when = "Python work; apply Pydantic and FastAPI sections only where the respective library is used."
dependencies = ["core"]
globs = ["**/*.py"]

